name: Propose upstream sync

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: management-center-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'hirsaeki/Cli-Proxy-API-Management-Center' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: false
      - name: Verify sync logic against local fixtures
        run: bash scripts/tests/fork-upstream-sync_test.sh
      - name: Propose review-only sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPOSITORY: hirsaeki/Cli-Proxy-API-Management-Center
          SYNC_UPSTREAM_URL: https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
        run: bash scripts/fork-upstream-sync.sh
